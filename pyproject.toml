[project]
name = "delta"
version = "0.1.0"
description = "A self-improving agent that optimizes a text-to-SQL agent's prompt, gated by statistical significance on held-out data."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }

dependencies = [
    "strands-agents[litellm]==1.50.2",
    "sqlglot==30.14.0",
    "pydantic==2.13.4",
    "typer==0.27.0",
    "rich==15.0.0",
    "tenacity==9.1.4",
    "numpy>=2.1",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.34",
    "jinja2==3.1.6",
]

[project.optional-dependencies]
# DSPy is only needed for the Phase 5 baseline comparison. Kept out of the
# default install so the core loop stays fast to set up.
baselines = ["dspy==3.2.1"]
dev = ["pytest==9.1.1", "ruff>=0.9"]

[project.scripts]
delta = "delta.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["delta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Import the package from the working tree rather than relying on the editable
# install's .pth, which does not get applied under the console-script entry
# point. Without this, `.venv/bin/pytest` fails while `python -m pytest` works.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
